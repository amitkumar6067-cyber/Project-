  <main class="page-content">
    <section style="padding:48px 0 24px;background:var(--bg-secondary)">
      <div class="container">
        <span class="section-label">Digital Library</span>
        <h1 style="margin-bottom:8px">Study Resources</h1>
        <p style="margin-bottom:24px">Notes, PDFs, previous papers, mock tests and more.</p>
        <div class="filter-tabs" id="resFilters">
          <button class="filter-tab active" data-type="all">All</button>
          <button class="filter-tab" data-type="notes">Notes</button>
          <button class="filter-tab" data-type="pdf">PDFs</button>
          <button class="filter-tab" data-type="paper">Previous Papers</button>
          <button class="filter-tab" data-type="mock">Mock Tests</button>
        </div>
      </div>
    </section>
    <section style="padding:24px 0 64px">
      <div class="container">
        <div style="display:grid;gap:12px" id="resourcesList"></div>
      </div>
    </section>
  </main>

    <a href="profile.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
  </nav>

  <script src="../js/data.js"></script>
  <script src="../js/lottie.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const render = (type = 'all') => {
        const items = type === 'all' ? EDUNOVA_DATA.resources : EDUNOVA_DATA.resources.filter(r => r.type === type);
        document.getElementById('resourcesList').innerHTML = items.map(r => `
          <div class="resource-card">
            <div class="resource-icon ${r.icon}">${r.icon === 'pdf' ? '📄' : r.icon === 'notes' ? '📝' : r.icon === 'paper' ? '📋' : '📊'}</div>
            <div class="resource-info">
              <h4>${r.title}</h4>
              <p>${r.subject} · ${r.type} · ${r.size}</p>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="App.toast('Download started (Demo)','success')">⬇️</button>
            <button class="btn btn-ghost btn-sm" onclick="App.toast('Bookmarked!','success')">🔖</button>
          </div>
        `).join('') || '<div class="empty-state"><div class="empty-state-icon">📚</div><h3>No resources</h3></div>';
      };
      render();
      document.querySelectorAll('#resFilters .filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('#resFilters .filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          render(tab.dataset.type);
        });
      });
    });
  </script>
</body>
