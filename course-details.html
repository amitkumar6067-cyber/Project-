<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Course Details — EDUNOVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="has-bottom-nav">
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="../index.html" class="logo"><div class="logo-mark">E</div> EDUNOVA</a>
      <div class="nav-actions">
        <button class="nav-theme-btn" id="themeToggle" aria-label="Toggle theme"></button>
        <a href="#" class="btn btn-ghost btn-sm" data-auth="logged-out" data-action="demo-login">Student Login</a>
        <div class="profile-dropdown" data-auth="logged-in" style="display:none">
          <button class="profile-btn" id="profileBtn"><div class="profile-avatar">AM</div></button>
          <div class="profile-menu" id="profileMenu">
            <a href="dashboard.html" class="profile-menu-item">Dashboard</a>
            <button class="profile-menu-item danger" data-action="logout">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="page-content" id="courseDetails">
    <!-- Filled by JS -->
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
    <a href="courses.html" class="bottom-nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Courses</a>
    <a href="player.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>Learn</a>
    <a href="results.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Results</a>
    <a href="profile.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
  </nav>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || 'jee-adv-2027';
      const course = EDUNOVA_DATA.courses.find(c => c.id === id) || EDUNOVA_DATA.courses[0];

      document.title = course.title + ' — EDUNOVA';

      const learnItems = [
        'Master core concepts with expert guidance',
        'Solve 1000+ practice problems',
        'Take full-length mock tests',
        'Access downloadable notes & formula sheets',
        'Attend live interactive classes',
        'Get personalized performance analytics'
      ];

      document.getElementById('courseDetails').innerHTML = `
        <section style="background:linear-gradient(135deg,var(--primary-700),var(--violet-600));padding:48px 0;color:white">
          <div class="container">
            <div class="badge" style="background:rgba(255,255,255,0.2);color:white;margin-bottom:12px">${course.category}</div>
            <h1 style="color:white;margin-bottom:12px">${course.title}</h1>
            <p style="color:rgba(255,255,255,0.85);max-width:600px;margin-bottom:20px">${course.description}</p>
            <div style="display:flex;flex-wrap:wrap;gap:16px;font-size:0.875rem;color:rgba(255,255,255,0.9);margin-bottom:24px">
              <span>★ ${course.rating}</span>
              <span>${course.students.toLocaleString()} students</span>
              <span>${course.duration}</span>
              <span>${course.language}</span>
              <span>${course.level}</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
              <div>
                <span style="font-size:1.75rem;font-weight:800">${App.formatPrice(course.price)}</span>
                <span style="text-decoration:line-through;opacity:0.7;margin-left:8px">${App.formatPrice(course.originalPrice)}</span>
                <span class="badge badge-success" style="margin-left:8px">${course.discount}% off</span>
              </div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:24px">
              ${course.enrolled
                ? `<a href="player.html?course=${course.id}" class="btn btn-lg" style="background:white;color:var(--primary-700)">Continue Learning</a>`
                : `<button class="btn btn-lg" style="background:white;color:var(--primary-700)" onclick="enrollCourse()">Enroll Now</button>`}
              <a href="player.html?course=${course.id}" class="btn btn-lg" style="border:1.5px solid rgba(255,255,255,0.4);color:white" data-action="demo-login">Try Demo</a>
            </div>
          </div>
        </section>

        <section style="padding:48px 0">
          <div class="container" style="display:grid;grid-template-columns:1fr;gap:40px">
            <div>
              <h2 style="margin-bottom:20px">What You'll Learn</h2>
              <div style="display:grid;grid-template-columns:1fr;gap:12px">
                ${learnItems.map(i => `
                  <div style="display:flex;gap:12px;align-items:flex-start">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.5" style="flex-shrink:0;margin-top:2px"><path d="M20 6 9 17l-5-5"/></svg>
                    <span>${i}</span>
                  </div>
                `).join('')}
              </div>

              <h2 style="margin:40px 0 20px">Course Curriculum</h2>
              <div id="curriculumList">
                ${EDUNOVA_DATA.curriculum.map((ch, i) => `
                  <div class="curriculum-chapter ${i === 2 ? 'open' : ''}" style="border:1px solid var(--border-light);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden">
                    <div class="chapter-header" onclick="this.parentElement.classList.toggle('open')">
                      <div>
                        <h4>${ch.title}</h4>
                        <span class="chapter-meta">${ch.lessons.length} lessons</span>
                      </div>
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                    </div>
                    <div class="chapter-lessons">
                      ${ch.lessons.map(l => `
                        <div class="lesson-item ${l.current ? 'active' : ''} ${l.locked ? 'locked' : ''}">
                          <span class="lesson-item-icon">${l.completed ? '✅' : l.locked ? '🔒' : l.type === 'quiz' ? '📝' : l.type === 'test' ? '📋' : l.type === 'notes' ? '📄' : '▶'}</span>
                          <span>${l.title}</span>
                          <span class="lesson-item-duration">${l.duration}</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>

              <h2 style="margin:40px 0 16px">Instructor</h2>
              <div class="faculty-card" style="text-align:left;display:flex;gap:16px;align-items:center;max-width:400px">
                <div class="faculty-portrait" style="width:64px;height:64px;margin:0;font-size:1.25rem;flex-shrink:0">${course.faculty.split(' ').map(n=>n[0]).join('').slice(0,2)}</div>
                <div>
                  <h3 class="faculty-name" style="margin:0">${course.faculty}</h3>
                  <div class="faculty-subject">${course.category} Specialist</div>
                </div>
              </div>
            </div>
          </div>
        </section>
      `;

      window.enrollCourse = () => {
        App.toast('Enrollment successful! (Demo)', 'success');
        setTimeout(() => {
          App.login();
          window.location.href = 'dashboard.html';
        }, 1000);
      };
    });
  </script>
</body>
</html>
