      <a href="../index.html" class="logo"><div class="logo-mark">E</div> EDUNOVA</a>
      <div class="nav-links">

        <a href="courses.html" class="nav-link">Courses</a>
        <a href="results.html" class="nav-link">Results</a>

        <a href="about.html" class="nav-link">About</a>
        <a href="resources.html" class="nav-link">Resources</a>

      </div>
      <div class="nav-actions">
        <button class="nav-theme-btn" id="themeToggle" aria-label="Toggle theme"></button>
        <a href="#" class="btn btn-ghost btn-sm nav-login-btn" data-auth="logged-out" data-action="demo-login">Student Login</a>
        <button class="mobile-menu-btn" id="mobileMenuBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      </div>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-menu-header">
      <a href="../index.html" class="logo"><div class="logo-mark">E</div> EDUNOVA</a>
      <button id="mobileMenuClose"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="mobile-nav-links">
      <a href="../index.html" class="mobile-nav-link">Home</a>
      <a href="courses.html" class="mobile-nav-link">Courses</a>
      <a href="results.html" class="mobile-nav-link">Results</a>
      <a href="faculty.html" class="mobile-nav-link">Faculty</a>
      <a href="about.html" class="mobile-nav-link">About</a>
      <a href="contact.html" class="mobile-nav-link">Contact</a>
    </div>
  </div>

  <main class="page-content">
    <section style="padding:48px 0 24px;background:var(--bg-secondary);text-align:center">
      <div class="container">
        <span class="section-label">Expert Educators</span>
        <h1 style="margin-bottom:8px">Meet Our Faculty</h1>
        <p>Learn from experienced educators from IITs, AIIMS and top institutions.</p>
      </div>
    </section>
    <section style="padding:32px 0 64px">
      <div class="container">
        <div class="faculty-grid" id="facultyFull" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
    <a href="courses.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Courses</a>
    <a href="player.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>Learn</a>
    <a href="results.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Results</a>
    <a href="profile.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
  </nav>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('facultyFull').innerHTML = EDUNOVA_DATA.faculty.map(f => `
        <div class="faculty-card" id="${f.id}">
          <div class="faculty-portrait">${f.name.split(' ').map(n => n[0]).join('').slice(0, 2)}</div>
          <h3 class="faculty-name">${f.name}</h3>
          <div class="faculty-subject">${f.subject}</div>
          <p class="faculty-exp">${f.experience} experience</p>
          <p style="font-size:0.8125rem;color:var(--text-tertiary);margin-bottom:12px">${f.qualifications}</p>
          <div class="faculty-rating">★ ${f.rating} · ${f.students.toLocaleString()} students</div>
          <p style="font-size:0.8125rem;margin-top:12px;color:var(--text-secondary)">${f.about}</p>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
