<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Timetable — EDUNOVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    .tt-item {
      display: grid; grid-template-columns: 80px 1fr auto; gap: 12px; align-items: center;
      padding: 14px 16px; background: var(--bg-card); border: 1px solid var(--border-light);
      border-radius: var(--radius-xl); margin-bottom: 10px;
    }
    .tt-item.completed { opacity: 0.65; }
    .status-pill { font-size: 0.6875rem; font-weight: 600; padding: 4px 10px; border-radius: var(--radius-full); }
    .status-pill.completed { background: var(--success-light); color: #047857; }
    .status-pill.upcoming { background: var(--primary-100); color: var(--primary-700); }
    [data-theme="dark"] .status-pill.completed { background: rgba(16,185,129,0.2); color: #34d399; }
    [data-theme="dark"] .status-pill.upcoming { background: rgba(99,102,241,0.2); color: var(--primary-300); }
  </style>
</head>
<body class="dashboard-page has-bottom-nav">
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="dashboard.html" class="logo"><div class="logo-mark">E</div> EDUNOVA</a>
      <div class="nav-actions">
        <button class="nav-theme-btn" id="themeToggle" aria-label="Toggle theme"></button>
        <a href="dashboard.html" class="btn btn-ghost btn-sm">Back</a>
      </div>
    </div>
  </nav>

  <main class="page-content">
    <div class="container" style="padding-top:24px;padding-bottom:48px;max-width:640px">
      <h1 style="font-size:1.5rem;margin-bottom:4px">Class Schedule</h1>
      <p style="margin-bottom:20px">Your timetable for today</p>
      <div class="filter-tabs">
        <button class="filter-tab active">Today</button>
        <button class="filter-tab">Tomorrow</button>
        <button class="filter-tab">This Week</button>
      </div>
      <div id="ttList"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="bottom-nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
    <a href="courses.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Courses</a>
    <a href="player.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>Learn</a>
    <a href="assignments.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Tests</a>
    <a href="profile.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
  </nav>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (!App.state.isLoggedIn) App.login();
      document.getElementById('ttList').innerHTML = EDUNOVA_DATA.timetable.map(function(t) {
        var sc = t.status === 'completed' ? 'completed' : 'upcoming';
        var btn = t.status === 'upcoming' && t.type === 'Live' ? '<button class="btn btn-primary btn-sm" onclick="App.toast(\'Joining class... (Demo)\',\'info\')">Join</button>' : '<span class="status-pill ' + sc + '">' + (t.status === 'completed' ? 'Done' : t.type) + '</span>';
        return '<div class="tt-item ' + (t.status === 'completed' ? 'completed' : '') + '"><div><div style="font-weight:700;font-size:0.875rem">' + t.time + '</div><div style="font-size:0.6875rem;color:var(--text-muted)">' + t.end + '</div></div><div><div style="font-weight:600">' + t.subject + '</div><div style="font-size:0.8125rem;color:var(--text-tertiary)">' + t.topic + '</div><div style="font-size:0.75rem;color:var(--text-muted)">' + t.faculty + '</div></div>' + btn + '</div>';
      }).join('');
    });
  </script>
</body>
</html>
